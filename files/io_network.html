        function getNodeTrace(positions, labels, nodeClasses = null) {
            const nodeX = positions.map(p => p[0]);
            const nodeY = positions.map(p => p[1]);
            const nodeColors = nodes.map((node, idx) => {
                const inH = nodeClasses && nodeClasses.in && nodeClasses.in.has(idx);
                const outH = nodeClasses && nodeClasses.out && nodeClasses.out.has(idx);
                const biH = nodeClasses && nodeClasses.bi && nodeClasses.bi.has(idx);
                if (selectedNode === idx) return '#FF9800';
                if (biH) return '#8e44ad';
                if (inH) return '#2ecc71';
                if (outH) return '#e74c3c';
                return 'lightblue';
            });
            const nodeSizesAdjusted = nodes.map((node, idx) => {
                const inH = nodeClasses && nodeClasses.in && nodeClasses.in.has(idx);
                const outH = nodeClasses && nodeClasses.out && nodeClasses.out.has(idx);
                const biH = nodeClasses && nodeClasses.bi && nodeClasses.bi.has(idx);
                if (selectedNode === idx) return nodeSizes[idx] * 1.5;
                if (inH || outH || biH) return nodeSizes[idx] * 1.2;
                return nodeSizes[idx];
            });
            const hoverTexts = nodes.map(function(node, idx) {
                var nm = labels[idx];
                var inDeg = (currentNetwork === 'ownership' ? inDegOwnership[idx] : inDegInterop[idx]);
                var outDeg = (currentNetwork === 'ownership' ? outDegOwnership[idx] : outDegInterop[idx]);
                return '<b>' + nm + '</b><br>In-degree: ' + inDeg + '<br>Out-degree: ' + outDeg + '<br>Click to highlight connections';
            });
            return {
                x: nodeX,
                y: nodeY,
                mode: 'markers+text',
                marker: {
                    size: nodeSizesAdjusted,
                    color: nodeColors,
                    line: {
                        color: 'white',
                        width: 2
                    }
                },
                text: labels,
                textposition: 'top center',
                textfont: {
                    size: 10,
                    color: 'black'
                },
                hovertext: hoverTexts,
                hoverinfo: 'text',
                showlegend: false
            };
        }
        function updateGraph() {
            const positions = currentLayout === 'ownership' ? posOwnership : posInterop;
            const labels = currentLanguage === 'chinese' ? labelsChinese : labelsEnglish;
            const edgesCurrent = currentNetwork === 'ownership' ? edgesOwnership : edgesInterop;
            let data = [];
            let nodeClasses = null;
            // Build base edges trace first
            // For interoperability network, when a node is selected, split into in/out/bi traces
            if (currentNetwork === 'interop' && selectedNode !== null) {
                const sName = nodes[selectedNode];
                const key = (a,b) => a + '||' + b;
                const pairToIndex = new Map();
                for (let i=0;i<edgesCurrent.length;i++) {
                    const e = edgesCurrent[i];
                    pairToIndex.set(key(e[0], e[1]), i);
                }
                const inSet = new Set();
                const outSet = new Set();
                const inNodesSet = new Set();
                const outNodesSet = new Set();
                for (let i=0;i<edgesCurrent.length;i++) {
                    const e = edgesCurrent[i];
                    if (e[1] === sName) {
                        inSet.add(i);
                        inNodesSet.add(nodeIndices[e[0]]);
                    }
                    if (e[0] === sName) {
                        outSet.add(i);
                        outNodesSet.add(nodeIndices[e[1]]);
                    }
                }
                const biSet = new Set();
                const biNodesSet = new Set();
                for (const idx of Array.from(outSet)) {
                    const nb = edgesCurrent[idx][1];
                    const revIdx = pairToIndex.get(key(nb, sName));
                    if (revIdx !== undefined && inSet.has(revIdx)) {
                        biSet.add(idx);
                        biSet.add(revIdx);
                        outSet.delete(idx);
                        inSet.delete(revIdx);
                        biNodesSet.add(nodeIndices[nb]);
                    }
                }
                // Remove bi nodes from in/out sets
                for (const bi of Array.from(biNodesSet)) {
                    inNodesSet.delete(bi);
                    outNodesSet.delete(bi);
                }
                const [baseTrace, inTrace, outTrace, biTrace] = (function() {
                    // Build edge traces
                    const baseX = []; const baseY = [];
                    const inX = []; const inY = [];
                    const outX = []; const outY = [];
                    const biX = []; const biY = [];
                    for (let i=0;i<edgesCurrent.length;i++) {
                        const e = edgesCurrent[i];
                        const fromIdx = nodeIndices[e[0]]; const toIdx = nodeIndices[e[1]];
                        const x0 = positions[fromIdx][0]; const y0 = positions[fromIdx][1];
                        const x1 = positions[toIdx][0]; const y1 = positions[toIdx][1];
                        if (biSet.has(i)) { biX.push(x0,x1,null); biY.push(y0,y1,null); continue; }
                        if (inSet.has(i)) { inX.push(x0,x1,null); inY.push(y0,y1,null); continue; }
                        if (outSet.has(i)) { outX.push(x0,x1,null); outY.push(y0,y1,null); continue; }
                        baseX.push(x0,x1,null); baseY.push(y0,y1,null);
                    }
                    const baseTrace = { name: 'edges-base', x: baseX, y: baseY, mode: 'lines', line: { width: 0.5, color: 'rgba(150,150,150,0.3)' }, hoverinfo: 'none', showlegend: false };
                    const inTrace = { name: 'edges-in', x: inX, y: inY, mode: 'lines', line: { width: 2, color: '#2ecc71' }, hoverinfo: 'none', showlegend: false };
                    const outTrace = { name: 'edges-out', x: outX, y: outY, mode: 'lines', line: { width: 2, color: '#e74c3c' }, hoverinfo: 'none', showlegend: false };
                    const biTrace = { name: 'edges-bi', x: biX, y: biY, mode: 'lines', line: { width: 2, color: '#8e44ad' }, hoverinfo: 'none', showlegend: false };
                    return [baseTrace, inTrace, outTrace, biTrace];
                })();
                nodeClasses = { in: inNodesSet, out: outNodesSet, bi: biNodesSet };
                const nodeTrace = getNodeTrace(positions, labels, nodeClasses); nodeTrace.name = 'nodes';
                data = [baseTrace, inTrace, outTrace, biTrace, nodeTrace];
            } else {
                // Non-directed highlight fallback (ownership network or no selection)
                let highlightEdges = null;
                if (selectedNode !== null) {
                    highlightEdges = new Set();
                    edgesCurrent.forEach((edge, idx) => {
                        const fromIdx = nodeIndices[edge[0]];
                        const toIdx = nodeIndices[edge[1]];
                        if (fromIdx === selectedNode || toIdx === selectedNode) highlightEdges.add(idx);
                    });
                }
                const [edgeTraceBase, edgeTraceHi] = getEdgeTraces(positions, edgesCurrent, highlightEdges);
                const nodeTrace = getNodeTrace(positions, labels, null); nodeTrace.name = 'nodes';
                data = [edgeTraceBase, edgeTraceHi, nodeTrace];
            }
            const layout = {
                title: '',
                showlegend: false,
                hovermode: 'closest',
                margin: { t: 0, b: 0, l: 0, r: 0 },
                xaxis: { showgrid: false, zeroline: false, showticklabels: false },
                yaxis: { showgrid: false, zeroline: false, showticklabels: false },
                plot_bgcolor: 'white',
                height: 800
            };
            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false
            };
            Plotly.newPlot('graph', data, layout, config);
            // Add click event
            document.getElementById('graph').on('plotly_click', function(data) {
                const traceName = data.points[0]?.fullData?.name;
                if (!traceName || traceName === 'nodes') { // only react on node clicks
                    const pointIndex = data.points[0].pointIndex;
                    if (selectedNode === pointIndex) {
                        selectedNode = null;
                    } else {
                        selectedNode = pointIndex;
                    }
                    updateGraph();
                }
            });
        }
        function switchLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('btn-chinese').classList.toggle('active', lang === 'chinese');
            document.getElementById('btn-english').classList.toggle('active', lang === 'english');
            updateGraph();
        }
        function switchLayout(layout) {
            currentLayout = layout;
            document.getElementById('btn-ownership').classList.toggle('active', layout === 'ownership');
            document.getElementById('btn-interop').classList.toggle('active', layout === 'interop');
            updateGraph();
        }
        function switchNetwork(net) {
            currentNetwork = net;
            document.getElementById('btn-net-interop').classList.toggle('active', net === 'interop');
            document.getElementById('btn-net-ownership').classList.toggle('active', net === 'ownership');
            updateGraph();
        }
        function resetHighlight() {
            selectedNode = null;
            updateGraph();
        }
        // Initial render
        updateGraph();
    </script>
</body>
</html>
